name: 币安带单 QQ 邮箱提醒
run-name: ${{ github.event_name == 'schedule' && '熬鹰监控｜GitHub 定时' || inputs.mode == 'monitor' && '熬鹰监控｜补查' || '熬鹰监控｜测试或诊断' }}

on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 运行方式
        type: choice
        default: test
        options:
          - test
          - diagnose
          - preview
          - monitor

permissions:
  contents: write

concurrency:
  group: binance-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: 读取监控程序
        uses: actions/checkout@v6
      - name: 检查币安公开记录
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose' }}
        run: python3 binance_alert.py --check
      - name: 检查 QQ 邮箱网络连接
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose' }}
        run: |
          python3 - <<'PY'
          import smtplib
          import ssl

          with smtplib.SMTP_SSL("smtp.qq.com", 465, context=ssl.create_default_context(), timeout=15) as mail:
              status, _ = mail.noop()
              if status != 250:
                  raise SystemExit(f"QQ 邮箱 SMTP 返回 {status}")
          print("QQ 邮箱 SMTP 已通过 TLS 连通")
          PY
      - name: 发送一条最新操作作为测试
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' }}
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_CODE: ${{ secrets.QQ_SMTP_CODE }}
        run: |
          python3 - <<'PY'
          import os
          from binance_alert import DEFAULT_PORTFOLIO, fetch_records, message_text, set_up_sender

          if not all(os.environ.get(name, "").strip() for name in ("QQ_EMAIL", "QQ_SMTP_CODE")):
              raise SystemExit("请先配置 QQ_EMAIL 和 QQ_SMTP_CODE")
          latest = next(fetch_records(DEFAULT_PORTFOLIO, 7), None)
          if latest is None:
              raise SystemExit("最近七天没有可用的公开记录")
          details = message_text([latest], DEFAULT_PORTFOLIO)
          send = set_up_sender(True, False)
          print(send("【测试】熬鹰资本最新带单记录", "手动发送的最新公开记录。\n\n" + details))
          print(details)
          PY
      - name: 读取币安记录并处理邮件
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'test' || inputs.mode == 'monitor' }}
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_CODE: ${{ secrets.QQ_SMTP_CODE }}
          # Only deliberate manual runs send a test email or establish a new baseline.
          MONITOR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test' && 'test' || 'monitor' }}
        run: python3 github_monitor.py --mode "$MONITOR_MODE" --worktree "$RUNNER_TEMP/binance-monitor-state"
