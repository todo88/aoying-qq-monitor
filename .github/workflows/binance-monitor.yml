name: 币安带单 QQ 邮箱提醒

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 运行方式
        type: choice
        default: test
        options:
          - test
          - diagnose

permissions:
  contents: write

concurrency:
  group: binance-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: 读取监控程序
        uses: actions/checkout@v6
      - name: 检查币安公开记录
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose' }}
        run: python3 binance_alert.py --check
      - name: 检查 QQ 邮箱网络连接
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose' }}
        run: |
          python3 - <<'PY'
          import smtplib
          import ssl

          with smtplib.SMTP_SSL("smtp.qq.com", 465, context=ssl.create_default_context(), timeout=15) as mail:
              status, _ = mail.noop()
              if status != 250:
                  raise SystemExit(f"QQ 邮箱 SMTP 返回 {status}")
          print("QQ 邮箱 SMTP 已通过 TLS 连通")
          PY
      - name: 读取币安记录并处理邮件
        if: ${{ github.event_name == 'schedule' || inputs.mode != 'diagnose' }}
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_CODE: ${{ secrets.QQ_SMTP_CODE }}
          # Only deliberate manual runs send a test email or establish a new baseline.
          MONITOR_MODE: ${{ github.event_name == 'workflow_dispatch' && 'test' || 'monitor' }}
        run: python3 github_monitor.py --mode "$MONITOR_MODE" --worktree "$RUNNER_TEMP/binance-monitor-state"
